<main class="bg-body-tertiary py-3 py-lg-4">
  <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
      <div>
        <p class="text-success text-uppercase fw-semibold small mb-1">Harborline · Loan application</p>
        <h1 class="h3 fw-bold text-dark mb-0">Applicant details</h1>
      </div>
      <p class="small text-secondary mb-1">Complete your details and add any existing loans.</p>
    </div>

    <form>
      <section class="card border-0 shadow-sm rounded-4 mb-3" aria-labelledby="applicant-details-heading">
        <div class="card-body p-3 p-lg-4">
          <h2 id="applicant-details-heading" class="h5 fw-bold mb-3">Personal and financial information</h2>

          <div class="row g-2">
            <div class="col-12 col-md-6 col-lg-3">
              <label for="full-name" class="form-label small fw-semibold mb-1">Full name</label>
              <input id="full-name" name="fullName" type="text" class="form-control" placeholder="As shown on your ID" autocomplete="name" required />
            </div>
            <div class="col-12 col-md-6 col-lg-3">
              <label for="pan-card" class="form-label small fw-semibold mb-1">PAN card</label>
              <input id="pan-card" name="panCard" type="text" class="form-control text-uppercase" placeholder="Enter PAN number" />
            </div>
            <div class="col-12 col-md-6 col-lg-3">
              <label for="date-of-birth" class="form-label small fw-semibold mb-1">Date of birth</label>
              <input id="date-of-birth" name="dateOfBirth" type="date" class="form-control" autocomplete="bday" required />
            </div>
            <div class="col-12 col-md-6 col-lg-3">
              <label for="email" class="form-label small fw-semibold mb-1">Email</label>
              <input id="email" name="email" type="email" class="form-control" placeholder="name@example.com" autocomplete="email" required />
            </div>

            <div class="col-12 col-md-6 col-lg-3">
              <label for="phone" class="form-label small fw-semibold mb-1">Phone</label>
              <input id="phone" name="phone" type="tel" class="form-control" placeholder="Phone number" autocomplete="tel" />
            </div>
            <div class="col-12 col-md-6 col-lg-3">
              <label for="address" class="form-label small fw-semibold mb-1">Address</label>
              <input id="address" name="address" type="text" class="form-control" placeholder="Street address" autocomplete="street-address" />
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label for="city" class="form-label small fw-semibold mb-1">City</label>
              <input id="city" name="city" type="text" class="form-control" autocomplete="address-level2" />
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label for="state" class="form-label small fw-semibold mb-1">State</label>
              <input id="state" name="state" type="text" class="form-control" autocomplete="address-level1" />
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label for="zip-code" class="form-label small fw-semibold mb-1">ZIP code</label>
              <input id="zip-code" name="zipCode" type="text" class="form-control" autocomplete="postal-code" />
            </div>

            <div class="col-12 col-md-4">
              <label for="annual-income" class="form-label small fw-semibold mb-1">Annual income</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input id="annual-income" name="annualIncome" type="number" class="form-control" placeholder="0" min="0" />
              </div>
            </div>
            <div class="col-12 col-md-4">
              <label for="employment-status" class="form-label small fw-semibold mb-1">Employment status</label>
              <select id="employment-status" name="employmentStatus" class="form-select">
                <option value="" selected disabled>Select status</option>
                <option>Employed</option>
                <option>Self-employed</option>
                <option>Retired</option>
                <option>Other</option>
              </select>
            </div>
            <div class="col-12 col-md-4">
              <label for="credit-score" class="form-label small fw-semibold mb-1">Credit score</label>
              <input id="credit-score" name="creditScore" type="number" class="form-control" placeholder="If known" min="300" max="850" />
            </div>
            <div class="col-12">
              <label for="assets" class="form-label small fw-semibold mb-1">Assets <span class="text-secondary fw-normal">(optional)</span></label>
              <input id="assets" name="assets" type="text" class="form-control" placeholder="Briefly describe savings, property, or other assets" />
            </div>
          </div>
        </div>
      </section>

      <section class="card border-0 shadow-sm rounded-4 mb-3" aria-labelledby="existing-loans-heading">
        <div class="card-body p-3 p-lg-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
              <h2 id="existing-loans-heading" class="h5 fw-bold mb-1">Existing loans</h2>
              <p class="small text-secondary mb-0">Do you currently have any loans to disclose?</p>
            </div>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="has-existing-loans" id="existing-loans-yes" value="yes" />
                <label class="form-check-label" for="existing-loans-yes">Yes</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="has-existing-loans" id="existing-loans-no" value="no" />
                <label class="form-check-label" for="existing-loans-no">No</label>
              </div>
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-12 col-md-4">
              <label for="loan-bank" class="form-label small fw-semibold mb-1">Bank name</label>
              <input id="loan-bank" name="bankName" type="text" class="form-control" placeholder="Enter bank name" />
            </div>
            <div class="col-12 col-md-4">
              <label for="loan-emi" class="form-label small fw-semibold mb-1">Loan detail <span class="text-secondary fw-normal">(monthly EMI)</span></label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input id="loan-emi" name="emi" type="number" class="form-control" placeholder="Monthly payment" min="0" />
              </div>
            </div>
            <div class="col-8 col-md-3">
              <label for="loan-amount" class="form-label small fw-semibold mb-1">Loan amount</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input id="loan-amount" name="loanAmount" type="number" class="form-control" placeholder="0" min="0" />
              </div>
            </div>
            <div class="col-4 col-md-1 d-grid">
              <button type="button" class="btn btn-success" aria-label="Add loan">Add</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Bank name</th>
                  <th scope="col">Loan detail / EMI</th>
                  <th scope="col" class="text-end">Loan amount</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="3" class="text-center text-secondary py-3">No loans added yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <div class="d-flex flex-wrap justify-content-end gap-2 pb-2">
        <button type="reset" class="btn btn-outline-secondary rounded-pill px-4">Clear form</button>
        <button type="submit" class="btn btn-success rounded-pill px-4 fw-semibold">Submit application</button>
      </div>
    </form>
  </div>
</main>
