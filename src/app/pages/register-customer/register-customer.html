<section class="py-5 bg-body-tertiary">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
          <div class="bg-success text-white px-4 py-3 text-center">
            <h2 class="h4 fw-bold mb-0">Create your account</h2>
          </div>

          <div class="card-body p-4 p-md-5">
            <form>

              <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold">Full name</label>
                <input type="text" id="fullName" [(ngModel)]="newUserObj.fullName" name="fullName" class="form-control rounded-3" placeholder="Enter your full name" />
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" id="email" [(ngModel)]="newUserObj.email" name="email" class="form-control rounded-3" placeholder="Enter your email" />
              </div>

              <div class="mb-3">
                <label for="userName" class="form-label fw-semibold">User Name</label>
                <input type="text" id="userName" [(ngModel)]="newUserObj.userName" name="userName" class="form-control rounded-3" placeholder="Enter your user name" />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" id="password" [(ngModel)]="newUserObj.password" name="password" class="form-control rounded-3" placeholder="Create a password" />
              </div>

              <div class="d-grid">
                <button type="button" (click)="onSaveCustomer()" class="btn btn-success btn-lg rounded-pill px-4 fw-semibold">Register</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
